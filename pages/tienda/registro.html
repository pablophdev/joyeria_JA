<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de usuario</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: sans-serif;
    }

    .form-container {
      background: white;
      border: 2px solid #333;
      padding: 30px;
      width: 350px;
      box-sizing: border-box;
    }

    .header {
      background-color: #d9d9d9;
      padding: 10px;
      margin: -30px -30px 20px -30px;
      font-weight: bold;
      font-size: 14px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 6px;
      border: 2px solid #333;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .row select {
      width: 50%;
      font-size: 11px;
    }

    .btn-container {
      text-align: center;
    }

    button {
      padding: 8px 24px;
      border: 2px solid #333;
      background: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 0px #333;
    }
  </style>
</head>
<body>

  <form class="form-container">
    <div class="header">Registro de usuario</div>

    <div class="field">
      <label for="nombre">NOMBRE COMPLETO</label>
      <input type="text" id="nombre" name="nombre">
    </div>

    <div class="field">
      <label for="correo">CORREO</label>
      <input type="email" id="correo" name="correo">
    </div>

    <div class="field">
      <label for="confirmar-correo">CORREO</label>
      <input type="email" id="confirmar-correo" name="confirmar-correo">
    </div>

    <div class="field">
      <label for="password">CONTRASEÑA</label>
      <input type="password" id="password" name="password">
    </div>

    <div class="field">
      <label for="confirmar-password">CONFIRMAR CONTRASEÑA</label>
      <input type="password" id="confirmar-password" name="confirmar-password">
    </div>

    <div class="field">
      <label for="telefono">TELEFONO (opcional)</label>
      <input type="tel" id="telefono" name="telefono">
    </div>

    <div class="row">
      <select name="region">
        <option value="">-- Seleccione la región --</option>
        <option value="metropolitana">Región Metropolitana de Santiago</option>
        <option value="araucania">Región de la Araucanía</option>
        <option value="nuble">Región de Ñuble</option>
      </select>

      <select name="comuna">
        <option value="">-- Seleccione la comuna --</option>
        <option value="linares">Linares</option>
        <option value="longavi">Longaví</option>
        <option value="concepcion">Concepción</option>
      </select>
    </div>

    <div class="btn-container">
      <button type="submit">REGISTRAR</button>
    </div>
  </form>

</body>
</html>
